# Mfklixo Modern Control Panel Nginx Configuration
# Pure Rust Gateway + Next.js 15 + Apache Hosting Reverse Proxy
user www-data;
pid /usr/local/lxlabs/kloxo/pid/kloxo-panel-nginx.pid;
error_log /usr/local/lxlabs/kloxo/log/kloxo-panel-error.log;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 256M;

    access_log /usr/local/lxlabs/kloxo/log/kloxo-panel-access.log;

    # HTTP Server on Port 7778
    server {
        listen 7778 default_server;
        listen [::]:7778 default_server;

        # Deny hidden files
        location ~ /\. {
            deny all;
        }

        # High-Performance Rust Core Gateway
        location /api/ {
            proxy_pass http://127.0.0.1:7788;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # phpMyAdmin Database Manager (Proxied to Apache 8080)
        location /phpmyadmin/ {
            proxy_pass http://127.0.0.1:8080/phpmyadmin/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
        }

        # Roundcube Webmail (Proxied to Apache 8080)
        location /webmail/ {
            proxy_pass http://127.0.0.1:8080/webmail/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
        }

        # Next.js Static Assets
        location /_next/static/ {
            alias /usr/local/lxlabs/kloxo/frontend/.next/static/;
            expires 365d;
            access_log off;
        }

        # Next.js Modern Dashboard (Proxied to local Next.js server on 3000)
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS Server on Port 7777
    server {
        listen 7777 ssl default_server;
        listen [::]:7777 ssl default_server;

        ssl_certificate /usr/local/lxlabs/kloxo/etc/program.pem;
        ssl_certificate_key /usr/local/lxlabs/kloxo/etc/program.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Redirect plain HTTP request on port 7777 to HTTPS automatically
        error_page 497 https://$http_host$request_uri;

        # Deny hidden files
        location ~ /\. {
            deny all;
        }

        # High-Performance Rust Core Gateway
        location /api/ {
            proxy_pass http://127.0.0.1:7788;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # phpMyAdmin Database Manager (Proxied to Apache 8080)
        location /phpmyadmin/ {
            proxy_pass http://127.0.0.1:8080/phpmyadmin/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
        }

        # Roundcube Webmail (Proxied to Apache 8080)
        location /webmail/ {
            proxy_pass http://127.0.0.1:8080/webmail/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
        }

        # Next.js Static Assets
        location /_next/static/ {
            alias /usr/local/lxlabs/kloxo/frontend/.next/static/;
            expires 365d;
            access_log off;
        }

        # Next.js Modern Dashboard (Proxied to local Next.js server on 3000)
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
