# Mfklixo Control Panel Nginx Configuration
user www-data;
pid /usr/local/lxlabs/kloxo/pid/kloxo-panel-nginx.pid;
error_log /usr/local/lxlabs/kloxo/log/kloxo-panel-error.log;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 256M;

    access_log /usr/local/lxlabs/kloxo/log/kloxo-panel-access.log;

    # HTTP Server on Port 7778
    server {
        listen 7778 default_server;
        listen [::]:7778 default_server;

        root /usr/local/lxlabs/kloxo/httpdocs;
        index index.php index.html;

        # Deny hidden files
        location ~ /\. {
            deny all;
        }

        # High-Performance Rust Core Gateway with PHP fallback
        location /api/ {
            proxy_pass http://127.0.0.1:7788;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_intercept_errors on;
            error_page 502 503 504 = @api_php_fallback;
        }

        location @api_php_fallback {
            include /etc/nginx/fastcgi_params;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param SCRIPT_FILENAME $document_root/api/index.php;
            fastcgi_param SCRIPT_NAME /api/index.php;
            fastcgi_pass unix:/usr/local/lxlabs/kloxo/init/kloxo-phpcgi.sock;
            fastcgi_read_timeout 3600;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
        }

        # Next.js Static Assets
        location /_next/static/ {
            alias /usr/local/lxlabs/kloxo/frontend/.next/static/;
            expires 365d;
            access_log off;
        }

        # Next.js Modern Dashboard (Proxied to local Next.js server on 3000)
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Fallback to legacy panel if Next.js is not yet running
            error_page 502 = @legacy_fallback;
        }

        location @legacy_fallback {
            try_files $uri $uri/ /index.php?$args;
        }

        # Legacy static assets
        location /theme/ {
            alias /usr/local/lxlabs/kloxo/httpdocs/theme/;
            expires 30d;
        }

        # Dedicated route for Legacy Control Panel with SSO bridge
        location ~ ^/legacy/?$ {
            rewrite ^ /legacy-sso.php last;
        }

        # Logout route rewrite to actual handler
        location = /logout.php {
            rewrite ^ /lib/php/logout.php last;
        }

        location ~ \.php$ {
            include /etc/nginx/fastcgi_params;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_pass unix:/usr/local/lxlabs/kloxo/init/kloxo-phpcgi.sock;
            fastcgi_read_timeout 3600;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
        }
    }

    # HTTPS Server on Port 7777
    server {
        listen 7777 ssl default_server;
        listen [::]:7777 ssl default_server;

        ssl_certificate /usr/local/lxlabs/kloxo/etc/program.pem;
        ssl_certificate_key /usr/local/lxlabs/kloxo/etc/program.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Redirect plain HTTP request on port 7777 to HTTPS automatically
        error_page 497 https://$http_host$request_uri;

        root /usr/local/lxlabs/kloxo/httpdocs;
        index index.php index.html;

        # Deny hidden files
        location ~ /\. {
            deny all;
        }

        # High-Performance Rust Core Gateway with PHP fallback
        location /api/ {
            proxy_pass http://127.0.0.1:7788;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_intercept_errors on;
            error_page 502 503 504 = @api_php_fallback;
        }

        location @api_php_fallback {
            include /etc/nginx/fastcgi_params;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param SCRIPT_FILENAME $document_root/api/index.php;
            fastcgi_param SCRIPT_NAME /api/index.php;
            fastcgi_pass unix:/usr/local/lxlabs/kloxo/init/kloxo-phpcgi.sock;
            fastcgi_read_timeout 3600;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
        }

        # Next.js Static Assets
        location /_next/static/ {
            alias /usr/local/lxlabs/kloxo/frontend/.next/static/;
            expires 365d;
            access_log off;
        }

        # Next.js Modern Dashboard (Proxied to local Next.js server on 3000)
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Fallback to legacy panel if Next.js is not yet running
            error_page 502 = @legacy_fallback;
        }

        location @legacy_fallback {
            try_files $uri $uri/ /index.php?$args;
        }

        # Legacy static assets
        location /theme/ {
            alias /usr/local/lxlabs/kloxo/httpdocs/theme/;
            expires 30d;
        }

        # Dedicated route for Legacy Control Panel with SSO bridge
        location ~ ^/legacy/?$ {
            rewrite ^ /legacy-sso.php last;
        }

        # Logout route rewrite to actual handler
        location = /logout.php {
            rewrite ^ /lib/php/logout.php last;
        }

        location ~ \.php$ {
            include /etc/nginx/fastcgi_params;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_pass unix:/usr/local/lxlabs/kloxo/init/kloxo-phpcgi.sock;
            fastcgi_read_timeout 3600;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
        }
    }
}
